name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install pytest pytest-cov hypothesis
      - run: pytest --cov=finpy --cov-report=term-missing --cov-fail-under=95
      - run: python scripts/preflight.py
      - run: docker build -t finpy .
      - run: docker run --rm finpy
